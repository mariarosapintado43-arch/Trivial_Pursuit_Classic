<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivial Pursuit Classic</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 10px;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    background: white;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Header */
.header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px;
    text-align: center;
}

.header h1 {
    font-size: 2.5em;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
}

.game-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
}

.player-info {
    font-size: 1.1em;
}

/* Game Area */
.game-area {
    display: flex;
    flex: 1;
    gap: 20px;
    padding: 20px;
    overflow: hidden;
}

.board-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    min-width: 300px;
}

.board {
    width: 100%;
    height: 100%;
    max-width: 500px;
    max-height: 500px;
}

/* Estilos de casillas */
.square {
    width: 40px;
    height: 40px;
    stroke: #333;
    stroke-width: 1;
    cursor: pointer;
    transition: all 0.3s ease;
}

.square:hover {
    stroke-width: 2;
    filter: brightness(1.1);
}

/* Colores de categorías */
.yellow {
    fill: #FFD700;
}

.brown {
    fill: #8B6F47;
}

.pink {
    fill: #FFB6C1;
}

.green {
    fill: #90EE90;
}

.orange {
    fill: #FFA500;
}

.cyan {
    fill: #87CEEB;
}

/* Centro */
.center-space {
    fill: #FFD700;
    stroke: #333;
    stroke-width: 2;
    cursor: pointer;
    transition: all 0.3s ease;
}

.center-space:hover {
    stroke-width: 3;
    filter: brightness(1.1);
}

/* Marcadores HQ */
.hq-marker {
    fill: none;
    stroke: #333;
    stroke-width: 2;
    r: 8;
    display: none;
}

/* Radios del tablero */
.radius {
    transform-origin: 300px 300px;
}

.top-left {
    transform: rotate(180deg);
}

.top-left .square {
    transform: translate(220, 120) rotate(0deg);
}

.top-left .square:nth-child(1) { transform: translate(220, 80); }
.top-left .square:nth-child(2) { transform: translate(220, 120); }
.top-left .square:nth-child(3) { transform: translate(220, 160); }
.top-left .square:nth-child(4) { transform: translate(220, 200); }
.top-left .square:nth-child(5) { transform: translate(220, 240); }

.top-left .hq-marker {
    cx: 280;
    cy: 240;
}

.top-right {
    transform: rotate(-60deg);
}

.top-right .square:nth-child(1) { transform: translate(380, 80); }
.top-right .square:nth-child(2) { transform: translate(380, 120); }
.top-right .square:nth-child(3) { transform: translate(380, 160); }
.top-right .square:nth-child(4) { transform: translate(380, 200); }
.top-right .square:nth-child(5) { transform: translate(380, 240); }

.top-right .hq-marker {
    cx: 420;
    cy: 240;
}

.right {
    transform: rotate(60deg);
}

.right .square:nth-child(1) { transform: translate(360, 240); }
.right .square:nth-child(2) { transform: translate(360, 280); }
.right .square:nth-child(3) { transform: translate(360, 320); }
.right .square:nth-child(4) { transform: translate(360, 360); }
.right .square:nth-child(5) { transform: translate(360, 400); }

.right .hq-marker {
    cx: 420;
    cy: 400;
}

.bottom-right {
    transform: rotate(120deg);
}

.bottom-right .square:nth-child(1) { transform: translate(220, 400); }
.bottom-right .square:nth-child(2) { transform: translate(220, 360); }
.bottom-right .square:nth-child(3) { transform: translate(220, 320); }
.bottom-right .square:nth-child(4) { transform: translate(220, 280); }
.bottom-right .square:nth-child(5) { transform: translate(220, 240); }

.bottom-right .hq-marker {
    cx: 280;
    cy: 240;
}

.bottom-left {
    transform: rotate(180deg);
}

.bottom-left .square:nth-child(1) { transform: translate(140, 400); }
.bottom-left .square:nth-child(2) { transform: translate(140, 360); }
.bottom-left .square:nth-child(3) { transform: translate(140, 320); }
.bottom-left .square:nth-child(4) { transform: translate(140, 280); }
.bottom-left .square:nth-child(5) { transform: translate(140, 240); }

.bottom-left .hq-marker {
    cx: 80;
    cy: 240;
}

.left {
    transform: rotate(240deg);
}

.left .square:nth-child(1) { transform: translate(140, 120); }
.left .square:nth-child(2) { transform: translate(140, 160); }
.left .square:nth-child(3) { transform: translate(140, 200); }
.left .square:nth-child(4) { transform: translate(140, 240); }
.left .square:nth-child(5) { transform: translate(140, 280); }

.left .hq-marker {
    cx: 80;
    cy: 280;
}

/* Fichas de jugadores */
.pieces-container {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
}

.player-piece {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid #333;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 12px;
    color: white;
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    transition: all 0.3s ease;
    pointer-events: auto;
    cursor: pointer;
}

.player-piece:hover {
    transform: scale(1.2);
}

/* Panel de Control */
.control-panel {
    width: 100%;
    max-width: 350px;
    background: #f8f9fa;
    border-radius: 10px;
    padding: 20px;
    overflow-y: auto;
    border: 2px solid #e0e0e0;
}

.panel-section {
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid #ddd;
}

.panel-section:last-child {
    border-bottom: none;
}

.panel-section h3 {
    color: #667eea;
    margin-bottom: 15px;
    font-size: 1.2em;
}

/* Lista de jugadores */
.players-list {
    background: white;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    max-height: 150px;
    overflow-y: auto;
}

.player-item {
    padding: 8px;
    margin-bottom: 5px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.95em;
}

.player-item.active {
    background: #e8f4fd;
    border-left: 4px solid #667eea;
    font-weight: bold;
}

.player-color-indicator {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #333;
}

.player-wedges {
    display: flex;
    gap: 3px;
    font-size: 0.8em;
}

/* Turno actual */
.turn-display {
    background: white;
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #667eea;
}

.turn-display p {
    margin: 5px 0;
    font-size: 0.95em;
}

/* Botones */
.btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1em;
    transition: all 0.3s ease;
    font-weight: bold;
}

.btn-primary {
    background: #667eea;
    color: white;
    width: 100%;
    margin-top: 10px;
}

.btn-primary:hover {
    background: #5568d3;
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

.btn-primary:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
}

.btn-reset {
    background: #ff6b6b;
    color: white;
    padding: 8px 15px;
    font-size: 0.9em;
}

.btn-reset:hover {
    background: #ee5a52;
}

.btn-success {
    background: #51cf66;
    color: white;
}

.btn-success:hover {
    background: #40c057;
}

.btn-danger {
    background: #ff6b6b;
    color: white;
}

.btn-danger:hover {
    background: #ee5a52;
}

/* Resultado del dado */
.dice-result {
    background: white;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-size: 1.5em;
    font-weight: bold;
    color: #667eea;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Área de preguntas */
.question-area {
    background: white;
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #667eea;
    min-height: 150px;
}

.question-area p {
    margin: 10px 0;
    line-height: 1.6;
}

.question-text {
    font-weight: bold;
    color: #333;
    margin-bottom: 15px;
}

.answer-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
}

.answer-btn {
    padding: 8px 12px;
    border: 2px solid #ddd;
    background: white;
    border-radius: 5px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    font-size: 0.9em;
}

.answer-btn:hover {
    border-color: #667eea;
    background: #f0f4ff;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

.modal.show {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    animation: slideIn 0.3s ease;
}

.modal-large {
    max-width: 600px;
}

@keyframes slideIn {
    from {
        transform: translateY(-50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.3s ease;
}

.close:hover,
.close:focus {
    color: #000;
}

/* Formulario de configuración */
.setup-form {
    margin-top: 20px;
}

.setup-form label {
    display: block;
    margin-top: 15px;
    margin-bottom: 8px;
    font-weight: bold;
    color: #333;
}

.setup-form select {
    width: 100%;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 1em;
    margin-bottom: 15px;
}

.player-inputs {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin: 20px 0;
}

.player-input-group {
    display: flex;
    gap: 10px;
    align-items: flex-end;
}

.player-input-group input {
    flex: 1;
    padding: 10px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 1em;
}

.player-input-group input:focus {
    outline: none;
    border-color: #667eea;
}

.color-picker {
    width: 50px;
    height: 45px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

/* Respuesta a pregunta */
.question-modal {
    text-align: center;
}

.question-modal h2 {
    color: #667eea;
    margin-bottom: 20px;
}

.question-modal .category-badge {
    display: inline-block;
    padding: 8px 15px;
    border-radius: 20px;
    color: white;
    font-weight: bold;
    margin-bottom: 15px;
    font-size: 0.9em;
}

.question-modal .question-text {
    font-size: 1.2em;
    margin: 20px 0;
}

.button-group {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.button-group .btn {
    flex: 1;
}

/* Responsive Design */
@media (max-width: 1024px) {
    .game-area {
        flex-direction: column;
    }

    .control-panel {
        max-width: 100%;
        max-height: 250px;
    }

    .board {
        max-width: 400px;
        max-height: 400px;
    }
}

@media (max-width: 768px) {
    .header h1 {
        font-size: 1.8em;
    }

    .game-area {
        padding: 10px;
        gap: 10px;
    }

    .control-panel {
        max-height: 200px;
        padding: 15px;
    }

    .panel-section {
        margin-bottom: 15px;
        padding-bottom: 15px;
    }

    .panel-section h3 {
        font-size: 1em;
    }

    .btn {
        padding: 8px 15px;
        font-size: 0.9em;
    }

    .modal-content {
        width: 95%;
        padding: 20px;
    }

    .players-list {
        max-height: 100px;
    }
}

@media (max-width: 480px) {
    .container {
        height: auto;
        min-height: 100vh;
    }

    .game-area {
        flex-direction: column;
        padding: 10px;
    }

    .board-container {
        min-width: 100%;
        height: 300px;
    }

    .board {
        max-width: 300px;
        max-height: 300px;
    }

    .control-panel {
        max-height: none;
        max-width: 100%;
    }

    .header {
        padding: 15px;
    }

    .header h1 {
        font-size: 1.5em;
        margin-bottom: 5px;
    }

    .game-info {
        flex-direction: column;
        gap: 5px;
    }

    .player-info {
        font-size: 1em;
    }

    .player-piece {
        width: 25px;
        height: 25px;
        font-size: 10px;
    }

    .button-group {
        flex-direction: column;
    }

    .player-input-group {
        flex-direction: column;
    }

    .color-picker {
        width: 100%;
    }
}

/* Colores de jugadores */
.color-red {
    background: #FF6B6B;
}

.color-blue {
    background: #4ECDC4;
}

.color-yellow {
    background: #FFD93D;
}

.color-green {
    background: #6BCB77;
}

.color-purple {
    background: #A78BFA;
}

.color-orange {
    background: #FF9F43;
}

/* Utilidades */
.hidden {
    display: none !important;
}

.text-center {
    text-align: center;
}

.mt-20 {
    margin-top: 20px;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Trivial Pursuit Classic</h1>
            <div class="game-info">
                <div class="player-info" id="playerInfo"></div>
                <button class="btn-reset" onclick="resetGame()">Nuevo Juego</button>
            </div>
        </div>

        <div class="game-area">
            <!-- Tablero Hexagonal -->
            <div class="board-container">
                <svg class="board" viewBox="0 0 600 600" width="600" height="600">
                    <!-- Centro -->
                    <circle cx="300" cy="300" r="40" class="center-space" id="center"></circle>
                    
                    <!-- Radio Superior Izquierdo (Rosa → Verde → Amarillo → Naranja → Marrón) -->
                    <g class="radius top-left">
                        <rect class="square pink" data-pos="0" data-category="entretenimiento"></rect>
                        <rect class="square green" data-pos="1" data-category="ciencias"></rect>
                        <rect class="square yellow" data-pos="2" data-category="historia"></rect>
                        <rect class="square orange" data-pos="3" data-category="deportes"></rect>
                        <rect class="square brown" data-pos="4" data-category="arte"></rect>
                        <circle class="hq-marker" data-category="entretenimiento"></circle>
                    </g>

                    <!-- Radio Superior Derecho (Marrón → Rosa → Amarillo → Azul → Verde) -->
                    <g class="radius top-right">
                        <rect class="square brown" data-pos="5" data-category="arte"></rect>
                        <rect class="square pink" data-pos="6" data-category="entretenimiento"></rect>
                        <rect class="square yellow" data-pos="7" data-category="historia"></rect>
                        <rect class="square cyan" data-pos="8" data-category="geografia"></rect>
                        <rect class="square green" data-pos="9" data-category="ciencias"></rect>
                        <circle class="hq-marker" data-category="historia"></circle>
                    </g>

                    <!-- Radio Derecho (Rosa → Naranja → Verde → Azul → Marrón) -->
                    <g class="radius right">
                        <rect class="square pink" data-pos="10" data-category="entretenimiento"></rect>
                        <rect class="square orange" data-pos="11" data-category="deportes"></rect>
                        <rect class="square green" data-pos="12" data-category="ciencias"></rect>
                        <rect class="square cyan" data-pos="13" data-category="geografia"></rect>
                        <rect class="square brown" data-pos="14" data-category="arte"></rect>
                        <circle class="hq-marker" data-category="entretenimiento"></circle>
                    </g>

                    <!-- Radio Inferior Derecho (Amarillo → Verde → Marrón → Naranja → Azul) -->
                    <g class="radius bottom-right">
                        <rect class="square yellow" data-pos="15" data-category="historia"></rect>
                        <rect class="square green" data-pos="16" data-category="ciencias"></rect>
                        <rect class="square brown" data-pos="17" data-category="arte"></rect>
                        <rect class="square orange" data-pos="18" data-category="deportes"></rect>
                        <rect class="square cyan" data-pos="19" data-category="geografia"></rect>
                        <circle class="hq-marker" data-category="rosa"></circle>
                    </g>

                    <!-- Radio Inferior Izquierdo (Naranja → Amarillo → Marrón → Azul → Rosa) -->
                    <g class="radius bottom-left">
                        <rect class="square orange" data-pos="20" data-category="deportes"></rect>
                        <rect class="square yellow" data-pos="21" data-category="historia"></rect>
                        <rect class="square brown" data-pos="22" data-category="arte"></rect>
                        <rect class="square cyan" data-pos="23" data-category="geografia"></rect>
                        <rect class="square pink" data-pos="24" data-category="entretenimiento"></rect>
                        <circle class="hq-marker" data-category="ciencias"></circle>
                    </g>

                    <!-- Radio Izquierdo (Amarillo → Rosa → Naranja → Verde → Azul) -->
                    <g class="radius left">
                        <rect class="square yellow" data-pos="25" data-category="historia"></rect>
                        <rect class="square pink" data-pos="26" data-category="entretenimiento"></rect>
                        <rect class="square orange" data-pos="27" data-category="deportes"></rect>
                        <rect class="square green" data-pos="28" data-category="ciencias"></rect>
                        <rect class="square cyan" data-pos="29" data-category="geografia"></rect>
                        <circle class="hq-marker" data-category="arte"></circle>
                    </g>
                </svg>

                <!-- Fichas de jugadores -->
                <div class="pieces-container" id="piecesContainer"></div>
            </div>

            <!-- Panel de control lateral -->
            <div class="control-panel">
                <div class="panel-section">
                    <h3>Jugadores</h3>
                    <div id="playersList" class="players-list"></div>
                    <button class="btn btn-primary" onclick="togglePlayerSetup()">Configurar Jugadores</button>
                </div>

                <div class="panel-section">
                    <h3>Turno Actual</h3>
                    <div id="currentTurn" class="turn-display">
                        <p>Esperando configuración...</p>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Controles</h3>
                    <button class="btn btn-primary" id="diceBtn" onclick="rollDice()" disabled>🎲 Tirar Dado</button>
                    <div id="diceResult" class="dice-result"></div>
                </div>

                <div class="panel-section">
                    <h3>Pregunta</h3>
                    <div id="questionArea" class="question-area"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para configurar jugadores -->
    <div id="setupModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="togglePlayerSetup()">&times;</span>
            <h2>Configurar Jugadores</h2>
            <div class="setup-form">
                <label>Número de jugadores:</label>
                <select id="playerCount" onchange="updatePlayerInputs()">
                    <option value="1">1 jugador</option>
                    <option value="2" selected>2 jugadores</option>
                    <option value="3">3 jugadores</option>
                    <option value="4">4 jugadores</option>
                </select>

                <div id="playerInputs" class="player-inputs"></div>

                <button class="btn btn-primary" onclick="startGame()">Comenzar Juego</button>
            </div>
        </div>
    </div>

    <!-- Modal para responder preguntas -->
    <div id="answerModal" class="modal">
        <div class="modal-content modal-large">
            <span class="close" onclick="closeAnswerModal()">&times;</span>
            <div id="answerContent"></div>
        </div>
    </div>

    <script>
// Base de datos de preguntas por categoría
const questions = {
    historia: [
        {
            question: "¿En qué año cayó el Imperio Romano de Occidente?",
            options: ["476 d.C.", "300 d.C.", "600 d.C.", "1066 d.C."],
            correct: 0
        },
        {
            question: "¿Quién fue el primer presidente de los Estados Unidos?",
            options: ["Thomas Jefferson", "George Washington", "Benjamin Franklin", "Alexander Hamilton"],
            correct: 1
        },
        {
            question: "¿En qué año terminó la Segunda Guerra Mundial?",
            options: ["1943", "1944", "1945", "1946"],
            correct: 2
        },
        {
            question: "¿Cuál fue la antigua capital del Imperio Inca?",
            options: ["Machu Picchu", "Cusco", "Puno", "Arequipa"],
            correct: 1
        }
    ],
    geografia: [
        {
            question: "¿Cuál es la capital de Francia?",
            options: ["Lyon", "París", "Marsella", "Toulouse"],
            correct: 1
        },
        {

// Estado del juego
let gameState = {
    players: [],
    currentPlayerIndex: 0,
    diceRoll: 0,
    selectedCategory: null,
    isAnswering: false
};

// Colores predefinidos para jugadores
const playerColors = [
    { name: 'Rojo', hex: '#FF6B6B', class: 'color-red' },
    { name: 'Azul', hex: '#4ECDC4', class: 'color-blue' },
    { name: 'Amarillo', hex: '#FFD93D', class: 'color-yellow' },
    { name: 'Verde', hex: '#6BCB77', class: 'color-green' },
    { name: 'Morado', hex: '#A78BFA', class: 'color-purple' },
    { name: 'Naranja', hex: '#FF9F43', class: 'color-orange' }
];

// Mapeo de categorías a colores
const categoryColors = {
    historia: '#FFD700',
    geografia: '#87CEEB',
    ciencias: '#90EE90',
    arte: '#A78BFA',
    entretenimiento: '#FFB6C1',
    deportes: '#FFA500'
};

const categoryNames = {
    historia: 'Historia',
    geografia: 'Geografía',
    ciencias: 'Ciencias y Naturaleza',
    arte: 'Arte y Literatura',
    entretenimiento: 'Entretenimiento',
    deportes: 'Deportes y Pasatiempos'
};

function togglePlayerSetup() {
    const modal = document.getElementById('setupModal');
    if (modal.classList.contains('show')) {
        modal.classList.remove('show');
    } else {
        modal.classList.add('show');
        updatePlayerInputs();
    }
}

function updatePlayerInputs() {
    const count = parseInt(document.getElementById('playerCount').value);
    const container = document.getElementById('playerInputs');
    container.innerHTML = '';

    for (let i = 0; i < count; i++) {
        const div = document.createElement('div');
        div.className = 'player-input-group';
        div.innerHTML = `
            <input type="text" id="player${i}Name" placeholder="Nombre del jugador ${i + 1}" value="Jugador ${i + 1}">
            <input type="color" id="player${i}Color" class="color-picker" value="${playerColors[i].hex}">
        `;
        container.appendChild(div);
    }
}

function startGame() {
    const count = parseInt(document.getElementById('playerCount').value);
    gameState.players = [];

    for (let i = 0; i < count; i++) {
        const name = document.getElementById(`player${i}Name`).value || `Jugador ${i + 1}`;
        const color = document.getElementById(`player${i}Color`).value;
        gameState.players.push({
            id: i,
            name: name,
            color: color,
            position: 30,
            wedges: new Set(),
            isAtCenter: true
        });
    }

    gameState.currentPlayerIndex = 0;
    gameState.diceRoll = 0;

    document.getElementById('setupModal').classList.remove('show');
    document.getElementById('diceBtn').disabled = false;
    updateUI();
    renderBoard();
}

function rollDice() {
    if (gameState.isAnswering) return;

    gameState.diceRoll = Math.floor(Math.random() * 6) + 1;
    document.getElementById('diceResult').innerHTML = `🎲 ${gameState.diceRoll}`;

    document.getElementById('diceBtn').disabled = true;
    setTimeout(() => {
        movePlayer(gameState.diceRoll);
        document.getElementById('diceBtn').disabled = false;
    }, 1000);
}

function movePlayer(steps) {
    const player = gameState.players[gameState.currentPlayerIndex];
    player.position = (player.position + steps) % 30;
    player.isAtCenter = player.position === 30;

    renderBoard();

    setTimeout(() => {
        checkLanding();
    }, 500);
}

function checkLanding() {
    const player = gameState.players[gameState.currentPlayerIndex];
    
    if (player.position === 30) {
        showCategorySelector();
    } else {
        const landingSquare = document.querySelector(`[data-pos="${player.position}"]`);
        if (landingSquare) {
            const category = landingSquare.getAttribute('data-category');
            gameState.selectedCategory = category;
            askQuestion(category);
        }
    }
}

function showCategorySelector() {
    const categories = Object.keys(categoryNames);
    
    let html = `
        <div class="question-modal">
            <h2>Elige una categoría</h2>
            <div class="answer-options">
    `;

    categories.forEach(cat => {
        html += `
            <button class="answer-btn" onclick="selectCategory('${cat}')">
                ${categoryNames[cat]}
            </button>
        `;
    });

    html += `</div></div>`;
    document.getElementById('answerContent').innerHTML = html;
    document.getElementById('answerModal').classList.add('show');
}

function selectCategory(category) {
    gameState.selectedCategory = category;
    document.getElementById('answerModal').classList.remove('show');
    askQuestion(category);
}

function askQuestion(category) {
    const categoryQuestions = questions[category];
    const question = categoryQuestions[Math.floor(Math.random() * categoryQuestions.length)];
    
    gameState.isAnswering = true;

    const categoryName = categoryNames[category];
    const categoryColor = categoryColors[category];

    let html = `
        <div class="question-modal">
            <div class="category-badge" style="background: ${categoryColor}">
                ${categoryName}
            </div>
            <h2>Pregunta</h2>
            <p class="question-text">${question.question}</p>
            <div class="answer-options">
    `;

    question.options.forEach((option, index) => {
        html += `
            <button class="answer-btn" onclick="submitAnswer(${index}, ${question.correct})">
                ${option}
            </button>
        `;
    });

    html += `</div></div>`;
    document.getElementById('answerContent').innerHTML = html;
    document.getElementById('answerModal').classList.add('show');
}

function submitAnswer(selected, correct) {
    const player = gameState.players[gameState.currentPlayerIndex];
    const category = gameState.selectedCategory;
    const isCorrect = selected === correct;

    let resultHTML = `<div class="question-modal">`;

    if (isCorrect) {
        resultHTML += `
            <h2 style="color: #51cf66;">¡Correcto! 🎉</h2>
            <p>Ganaste un quesito de ${categoryNames[category]}</p>
        `;
        player.wedges.add(category);

        if (player.wedges.size === 6) {
            resultHTML += `
                <h3 style="color: #667eea; margin-top: 20px;">¡Ahora ve al centro para la pregunta final!</h3>
            `;
        }
    } else {
        resultHTML += `
            <h2 style="color: #ff6b6b;">Incorrecto ❌</h2>
            <p>Lo siento, esa no es la respuesta correcta.</p>
        `;
    }

    resultHTML += `
        <button class="btn btn-primary mt-20" onclick="nextTurn()">Siguiente turno</button>
    </div>
    `;

    document.getElementById('answerContent').innerHTML = resultHTML;
}

function nextTurn() {
    gameState.isAnswering = false;
    gameState.diceRoll = 0;
    gameState.currentPlayerIndex = (gameState.currentPlayerIndex + 1) % gameState.players.length;
    
    closeAnswerModal();
    updateUI();
    renderBoard();
}

function closeAnswerModal() {
    document.getElementById('answerModal').classList.remove('show');
}

function updateUI() {
    updatePlayersList();
    updateTurnDisplay();
    updateQuestionArea();
}

function updatePlayersList() {
    const container = document.getElementById('playersList');
    container.innerHTML = '';

    gameState.players.forEach((player, index) => {
        const isActive = index === gameState.currentPlayerIndex;
        const wedgeIcons = Array.from(player.wedges).map(w => '🥧').join('');
        
        const div = document.createElement('div');
        div.className = `player-item ${isActive ? 'active' : ''}`;
        div.innerHTML = `
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="player-color-indicator" style="background: ${player.color}"></div>
                <span>${player.name}</span>
            </div>
            <div class="player-wedges">${wedgeIcons}</div>
        `;
        container.appendChild(div);
    });
}

function updateTurnDisplay() {
    const player = gameState.players[gameState.currentPlayerIndex];
    const html = `
        <p><strong>Jugador:</strong> ${player.name}</p>
        <p><strong>Quesitos:</strong> ${player.wedges.size}/6</p>
        <p><strong>Posición:</strong> ${player.position === 30 ? 'Centro' : `Casilla ${player.position}`}</p>
    `;
    document.getElementById('currentTurn').innerHTML = html;
}

function updateQuestionArea() {
    const html = `
        <p>Presiona el botón para tirar el dado y comenzar tu turno.</p>
    `;
    document.getElementById('questionArea').innerHTML = html;
}

function renderBoard() {
    const container = document.getElementById('piecesContainer');
    container.innerHTML = '';

    const positions = {
        30: { x: 300, y: 300 }
    };

    for (let i = 0; i < 30; i++) {
        const angle = (i / 30) * Math.PI * 2;
        const radius = 140;
        positions[i] = {
            x: 300 + Math.cos(angle) * radius,
            y: 300 + Math.sin(angle) * radius
        };
    }

    gameState.players.forEach((player, index) => {
        const pos = positions[player.position];
        const piece = document.createElement('div');
        piece.className = 'player-piece';
        piece.style.left = (pos.x - 15) + 'px';
        piece.style.top = (pos.y - 15) + 'px';
        piece.style.background = player.color;
        piece.textContent = index + 1;
        piece.title = player.name;
        
        container.appendChild(piece);
    });
}

function resetGame() {
    gameState = {
        players: [],
        currentPlayerIndex: 0,
        diceRoll: 0,
        selectedCategory: null,
        isAnswering: false
    };
    
    document.getElementById('diceResult').innerHTML = '';
    document.getElementById('answerModal').classList.remove('show');
    document.getElementById('setupModal').classList.add('show');
    document.getElementById('diceBtn').disabled = true;
    updatePlayerInputs();
    renderBoard();
}

document.addEventListener('DOMContentLoaded', function() {
    setTimeout(() => {
        document.getElementById('setupModal').classList.add('show');
        updatePlayerInputs();
    }, 500);
});

window.onclick = function(event) {
    const setupModal = document.getElementById('setupModal');
    const answerModal = document.getElementById('answerModal');
    
    if (event.target === setupModal) {
        setupModal.classList.remove('show');
    }
    if (event.target === answerModal) {
        answerModal.classList.remove('show');
    }
};
    </script>
