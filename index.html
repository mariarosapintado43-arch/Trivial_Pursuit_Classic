<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivial Pursuit Classic - Mejorado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #284953 0%, #18323a 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header p {
            font-size: 1.1em;
            color: #6ec6d6;
        }

        /* Sección Tablero */
        .board-section {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(24, 50, 58, 0.8);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .board-wrapper {
            position: relative;
            width: 600px;
            height: 600px;
            perspective: 1000px;
        }

        .board-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.6));
        }

        .square-cell {
            cursor: pointer;
            transition: all 0.2s ease;
            stroke-width: 2;
            stroke: #fff;
        }

        .square-cell:hover {
            filter: brightness(1.2);
            stroke-width: 3;
        }

        .square-cell.white-tile {
            fill: #f5f5f5 !important;
        }

        .hq-square {
            cursor: pointer;
            transition: all 0.2s ease;
            stroke: #fff;
            stroke-width: 2;
        }

        .hq-square:hover {
            filter: brightness(1.2);
        }

        .center-hexagon {
            cursor: pointer;
            transition: all 0.2s ease;
            stroke: #fff;
            stroke-width: 3;
        }

        .center-hexagon:hover {
            filter: brightness(1.2);
        }

        /* Panel de Control - Horizontal */
        .control-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            background: rgba(24, 50, 58, 0.8);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .control-panel {
            background: rgba(19, 36, 43, 0.6);
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid #6ec6d6;
        }

        .control-panel h3 {
            color: #f1c40f;
            margin-bottom: 12px;
            font-size: 1.1em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Jugadores */
        .players-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            transition: all 0.2s ease;
        }

        .player-item.active {
            background: rgba(110, 198, 214, 0.2);
            border-left: 3px solid #6ec6d6;
            font-weight: bold;
        }

        .player-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .player-wedges {
            display: flex;
            gap: 2px;
        }

        .wedge-icon {
            font-size: 0.8em;
        }

        /* Dado 3D */
        .dice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .dice-container-3d {
            width: 120px;
            height: 120px;
            perspective: 1200px;
        }

        .dice-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: roll-animation 0.8s ease-out;
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .dice-face {
            position: absolute;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(135deg, #f1c40f 0%, #e67e22 100%);
            border: 3px solid #fff;
            border-radius: 8px;
            color: #000;
            backface-visibility: hidden;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3),
                        inset 0 -2px 4px rgba(0, 0, 0, 0.3);
        }

        .dice-face-1 { transform: rotateY(0deg) translateZ(60px); }
        .dice-face-2 { transform: rotateY(180deg) translateZ(60px); }
        .dice-face-3 { transform: rotateY(90deg) translateZ(60px); }
        .dice-face-4 { transform: rotateY(-90deg) translateZ(60px); }
        .dice-face-5 { transform: rotateX(90deg) translateZ(60px); }
        .dice-face-6 { transform: rotateX(-90deg) translateZ(60px); }

        @keyframes roll-animation {
            0% { transform: rotateX(0) rotateY(0) rotateZ(0); }
            100% { transform: rotateX(720deg) rotateY(720deg) rotateZ(720deg); }
        }

        .dice-value {
            font-size: 1.2em;
            font-weight: bold;
            color: #f1c40f;
            min-height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Botones */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: #e67e22;
            color: #fff;
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) {
            background: #d66c0d;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.4);
        }

        .btn-primary:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-secondary {
            background: #34495e;
            color: #fff;
            width: 100%;
        }

        .btn-secondary:hover {
            background: #2c3e50;
            transform: translateY(-2px);
        }

        /* Área de Pregunta */
        .question-panel {
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .question-text {
            font-size: 1em;
            line-height: 1.5;
            color: #cfe8ea;
            margin-bottom: 12px;
        }

        .answer-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .answer-btn {
            padding: 8px;
            border: 2px solid #6ec6d6;
            background: transparent;
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9em;
            text-align: left;
        }

        .answer-btn:hover {
            background: rgba(110, 198, 214, 0.2);
            border-color: #f1c40f;
        }

        .answer-btn.correct {
            background: #2ecc71;
            border-color: #27ae60;
            color: #000;
            font-weight: bold;
        }

        .answer-btn.incorrect {
            background: #e74c3c;
            border-color: #c0392b;
            color: #fff;
            font-weight: bold;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: #284953;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 3px solid #6ec6d6;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #6ec6d6;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #f1c40f;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: #6ec6d6;
            font-size: 28px;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: #fff;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .board-wrapper {
                width: 500px;
                height: 500px;
            }

            .control-section {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .board-section {
                padding: 15px;
            }

            .board-wrapper {
                width: 400px;
                height: 400px;
            }

            .control-section {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .dice-container-3d {
                width: 90px;
                height: 90px;
            }

            .dice-face {
                width: 90px;
                height: 90px;
                font-size: 2em;
            }

            .dice-face-1 { transform: rotateY(0deg) translateZ(45px); }
            .dice-face-2 { transform: rotateY(180deg) translateZ(45px); }
            .dice-face-3 { transform: rotateY(90deg) translateZ(45px); }
            .dice-face-4 { transform: rotateY(-90deg) translateZ(45px); }
            .dice-face-5 { transform: rotateX(90deg) translateZ(45px); }
            .dice-face-6 { transform: rotateX(-90deg) translateZ(45px); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 5px;
            }

            .board-section {
                padding: 10px;
            }

            .board-wrapper {
                width: 100%;
                max-width: 300px;
                height: 300px;
            }

            .control-section {
                grid-template-columns: 1fr;
                gap: 10px;
                padding: 10px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .control-panel {
                padding: 10px;
            }
        }

        /* Utility */
        .text-center {
            text-align: center;
        }

        .mt-20 {
            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }

        /* HQ Square Styling */
        .hq-triangle {
            fill: #fff;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .hq-cherub {
            font-size: 12px;
            text-anchor: middle;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎮 Trivial Pursuit Classic</h1>
            <p>Consigue los 6 quesitos y vuelve al centro</p>
        </div>

        <!-- Tablero -->
        <div class="board-section">
            <div class="board-wrapper">
                <svg class="board-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
                    <!-- Fondo -->
                    <rect width="600" height="600" fill="#13242b"/>
                    
                    <!-- Anillo exterior decorativo -->
                    <circle cx="300" cy="300" r="280" fill="none" stroke="#6ec6d6" stroke-width="2" opacity="0.3"/>
                    
                    <!-- Centro (Hexágono) -->
                    <polygon points="300,250 350,275 350,325 300,350 250,325 250,275" class="center-hexagon" fill="#f1c40f" data-type="center"/>
                    <text x="300" y="310" text-anchor="middle" font-size="20" fill="#000" font-weight="bold" pointer-events="none">🏠</text>
                    
                    <!-- RADIO 1: AMARILLO (Historia) -->
                    <rect x="280" y="80" width="40" height="40" class="square-cell" fill="#f1c40f" stroke="#fff" data-category="historia" data-type="normal"/>
                    <rect x="280" y="130" width="40" height="40" class="square-cell white-tile" fill="#f5f5f5" stroke="#999" data-type="retry"/>
                    <rect x="280" y="180" width="40" height="40" class="square-cell" fill="#f1c40f" stroke="#fff" data-category="historia" data-type="normal"/>
                    <g data-type="hq" data-category="historia">
                        <rect x="270" y="220" width="60" height="60" class="hq-square" fill="#f1c40f" stroke="#fff"/>
                        <polygon points="300,225 320,245 280,245" class="hq-triangle" fill="#FFD700"/>
                        <text x="300" y="280" class="hq-cherub" fill="#000">👼</text>
                    </g>

                    <!-- RADIO 2: ROSA (Entretenimiento) -->
                    <g>
                        <rect x="420" y="130" width="40" height="40" class="square-cell" fill="#e91e63" stroke="#fff" data-category="entretenimiento" data-type="normal" transform="rotate(-60 440 150)"/>
                        <rect x="440" y="165" width="40" height="40" class="square-cell white-tile" fill="#f5f5f5" stroke="#999" data-type="retry" transform="rotate(-60 460 185)"/>
                        <rect x="460" y="200" width="40" height="40" class="square-cell" fill="#e91e63" stroke="#fff" data-category="entretenimiento" data-type="normal" transform="rotate(-60 480 220)"/>
                        <g data-type="hq" data-category="entretenimiento" transform="translate(470, 235)">
                            <rect x="-30" y="-30" width="60" height="60" class="hq-square" fill="#e91e63" stroke="#fff"/>
                            <polygon points="0,-25 20,-5 -20,-5" class="hq-triangle" fill="#FF1493"/>
                            <text x="0" y="25" class="hq-cherub" fill="#000">👼</text>
                        </g>
                    </g>

                    <!-- RADIO 3: VERDE (Ciencias) -->
                    <g>
                        <rect x="420" y="430" width="40" height="40" class="square-cell" fill="#2ecc71" stroke="#fff" data-category="ciencias" data-type="normal" transform="rotate(60 440 450)"/>
                        <rect x="440" y="395" width="40" height="40" class="square-cell white-tile" fill="#f5f5f5" stroke="#999" data-type="retry" transform="rotate(60 460 415)"/>
                        <rect x="460" y="360" width="40" height="40" class="square-cell" fill="#2ecc71" stroke="#fff" data-category="ciencias" data-type="normal" transform="rotate(60 480 380)"/>
                        <g data-type="hq" data-category="ciencias" transform="translate(470, 325)">
                            <rect x="-30" y="-30" width="60" height="60" class="hq-square" fill="#2ecc71" stroke="#fff"/>
                            <polygon points="0,25 20,5 -20,5" class="hq-triangle" fill="#27AE60"/>
                            <text x="0" y="-10" class="hq-cherub" fill="#000">👼</text>
                        </g>
                    </g>

                    <!-- RADIO 4: NARANJA (Deportes) -->
                    <rect x="280" y="480" width="40" height="40" class="square-cell" fill="#e67e22" stroke="#fff" data-category="deportes" data-type="normal"/>
                    <rect x="280" y="430" width="40" height="40" class="square-cell white-tile" fill="#f5f5f5" stroke="#999" data-type="retry"/>
                    <rect x="280" y="380" width="40" height="40" class="square-cell" fill="#e67e22" stroke="#fff" data-category="deportes" data-type="normal"/>
                    <g data-type="hq" data-category="deportes">
                        <rect x="270" y="320" width="60" height="60" class="hq-square" fill="#e67e22" stroke="#fff"/>
                        <polygon points="300,365 320,345 280,345" class="hq-triangle" fill="#D35400"/>
                        <text x="300" y="340" class="hq-cherub" fill="#000">👼</text>
                    </g>

                    <!-- RADIO 5: MARRÓN (Arte) -->
                    <g>
                        <rect x="140" y="430" width="40" height="40" class="square-cell" fill="#8B4513" stroke="#fff" data-category="arte" data-type="normal" transform="rotate(-60 160 450)"/>
                        <rect x="120" y="395" width="40" height="40" class="square-cell white-tile" fill="#f5f5f5" stroke="#999" data-type="retry" transform="rotate(-60 140 415)"/>
                        <rect x="100" y="360" width="40" height="40" class="square-cell" fill="#8B4513" stroke="#fff" data-category="arte" data-type="normal" transform="rotate(-60 120 380)"/>
                        <g data-type="hq" data-category="arte" transform="translate(90, 325)">
                            <rect x="-30" y="-30" width="60" height="60" class="hq-square" fill="#8B4513" stroke="#fff"/>
                            <polygon points="0,25 20,5 -20,5" class="hq-triangle" fill="#654321"/>
                            <text x="0" y="-10" class="hq-cherub" fill="#fff">👼</text>
                        </g>
                    </g>

                    <!-- RADIO 6: CYAN (Geografía) -->
                    <g>
                        <rect x="140" y="130" width="40" height="40" class="square-cell" fill="#6ec6d6" stroke="#fff" data-category="geografia" data-type="normal" transform="rotate(60 160 150)"/>
                        <rect x="120" y="165" width="40" height="40" class="square-cell white-tile" fill="#f5f5f5" stroke="#999" data-type="retry" transform="rotate(60 140 185)"/>
                        <rect x="100" y="200" width="40" height="40" class="square-cell" fill="#6ec6d6" stroke="#fff" data-category="geografia" data-type="normal" transform="rotate(60 120 220)"/>
                        <g data-type="hq" data-category="geografia" transform="translate(90, 235)">
                            <rect x="-30" y="-30" width="60" height="60" class="hq-square" fill="#6ec6d6" stroke="#fff"/>
                            <polygon points="0,-25 20,-5 -20,-5" class="hq-triangle" fill="#5BA6AA"/>
                            <text x="0" y="25" class="hq-cherub" fill="#000">👼</text>
                        </g>
                    </g>

                    <!-- Líneas de conexión -->
                    <line x1="300" y1="300" x2="300" y2="240" stroke="#6ec6d6" stroke-width="1" opacity="0.3"/>
                    <line x1="300" y1="300" x2="450" y2="360" stroke="#6ec6d6" stroke-width="1" opacity="0.3"/>
                    <line x1="300" y1="300" x2="450" y2="240" stroke="#6ec6d6" stroke-width="1" opacity="0.3"/>
                    <line x1="300" y1="300" x2="300" y2="360" stroke="#6ec6d6" stroke-width="1" opacity="0.3"/>
                    <line x1="300" y1="300" x2="150" y2="240" stroke="#6ec6d6" stroke-width="1" opacity="0.3"/>
                    <line x1="300" y1="300" x2="150" y2="360" stroke="#6ec6d6" stroke-width="1" opacity="0.3"/>
                </svg>
            </div>
        </div>

        <!-- Panel de Control (Horizontal) -->
        <div class="control-section">
            <!-- Panel de Jugadores -->
            <div class="control-panel">
                <h3>👥 Jugadores</h3>
                <div class="players-list" id="playersList"></div>
                <button class="btn btn-secondary mt-20" onclick="toggleSetup()">Configurar</button>
            </div>

            <!-- Panel de Dado -->
            <div class="control-panel dice-section">
                <h3>🎲 Dado</h3>
                <div class="dice-container-3d">
                    <div class="dice-3d" id="dice3d">
                        <div class="dice-face dice-face-1">1</div>
                        <div class="dice-face dice-face-2">2</div>
                        <div class="dice-face dice-face-3">3</div>
                        <div class="dice-face dice-face-4">4</div>
                        <div class="dice-face dice-face-5">5</div>
                        <div class="dice-face dice-face-6">6</div>
                    </div>
                </div>
                <div class="dice-value" id="diceValue">-</div>
                <button class="btn btn-primary" id="rollBtn" onclick="rollDice()">Tirar Dado</button>
            </div>

            <!-- Panel de Turno -->
            <div class="control-panel">
                <h3>📋 Turno Actual</h3>
                <div id="turnInfo" style="font-size: 0.9em; line-height: 1.8;">
                    <p>Esperando que comience el juego...</p>
                </div>
            </div>

            <!-- Panel de Pregunta -->
            <div class="control-panel question-panel">
                <h3>❓ Pregunta</h3>
                <div id="questionArea">
                    <p style="color: #999; font-size: 0.9em;">Las preguntas aparecerán aquí</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Configuración -->
    <div id="setupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Configurar Juego</h2>
                <button class="close-btn" onclick="toggleSetup()">✕</button>
            </div>
            <label style="color: #6ec6d6; margin-bottom: 10px; display: block;">Número de jugadores:</label>
            <select id="playerCount" onchange="updatePlayerInputs()" style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 6px; border: none;">
                <option value="1">1 jugador</option>
                <option value="2" selected>2 jugadores</option>
                <option value="3">3 jugadores</option>
                <option value="4">4 jugadores</option>
                <option value="6">6 jugadores</option>
            </select>
            <div id="playerInputs"></div>
            <button class="btn btn-primary mt-20" onclick="startGame()">Comenzar</button>
        </div>
    </div>

    <!-- Modal de Respuesta -->
    <div id="answerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="categoryTitle">Pregunta</h2>
                <button class="close-btn" onclick="closeAnswer()">✕</button>
            </div>
            <div id="answerContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
